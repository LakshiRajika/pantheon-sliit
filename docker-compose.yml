services:
  db:
    image: postgres:17
    container_name: pantheon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantheon_db
      POSTGRES_USER: pantheon_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pantheon_pass}
    ports:
      - "5433:5432"
    volumes:
      - pantheon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantheon_user -d pantheon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pantheon_postgres_data:
